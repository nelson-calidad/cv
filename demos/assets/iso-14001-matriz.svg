<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="100%" height="100%" fill="none">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#F1F1EF" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background with subtle technical grid -->
  <rect width="760" height="480" fill="#FCFCFB"/>
  <rect width="760" height="480" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="759" height="479" rx="0" stroke="#E5E5E2"/>

  <!-- Blueprint Header -->
  <rect x="24" y="24" width="712" height="48" rx="6" fill="#FFFFFF" stroke="#E5E5E2"/>
  <text x="44" y="45" font-family="'Manrope', -apple-system, sans-serif" font-size="11" font-weight="800" fill="#171717" letter-spacing="0.08em">SISTEMA DE GESTIÓN AMBIENTAL · NORMA ISO 14001:2015</text>
  <text x="44" y="60" font-family="'DM Sans', -apple-system, sans-serif" font-size="11" font-weight="500" fill="#737373">Matriz de Identificación de Aspectos e Impactos Ambientales Operativos · Autosol Concesionario Oficial</text>
  <rect x="630" y="36" width="90" height="24" rx="12" fill="#F4F4F2" stroke="#E0E0DC"/>
  <text x="646" y="52" font-family="'DM Sans', -apple-system, sans-serif" font-size="10" font-weight="700" fill="#171717">TESIS UNJu</text>

  <!-- Process Flow Schematic: 3 Stages -->
  <!-- 1. Entradas / Insumos -->
  <rect x="24" y="92" width="216" height="180" rx="8" fill="#FFFFFF" stroke="#E5E5E2"/>
  <rect x="24" y="92" width="216" height="32" rx="8" fill="#F8F8F6"/>
  <text x="38" y="113" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#171717">1. ENTRADAS OPERATIVAS</text>
  <text x="38" y="142" font-family="'DM Sans', sans-serif" font-size="11.5" font-weight="600" fill="#242424">• Lubricantes sintéticos / minerales</text>
  <text x="38" y="166" font-family="'DM Sans', sans-serif" font-size="11.5" font-weight="600" fill="#242424">• Fluidos de frenos y refrigerantes</text>
  <text x="38" y="190" font-family="'DM Sans', sans-serif" font-size="11.5" font-weight="600" fill="#242424">• Agua de red (Lavadero / Foso)</text>
  <text x="38" y="214" font-family="'DM Sans', sans-serif" font-size="11.5" font-weight="600" fill="#242424">• Energía eléctrica trifásica</text>
  <text x="38" y="238" font-family="'DM Sans', sans-serif" font-size="11.5" font-weight="600" fill="#242424">• Solventes y pinturas de cabina</text>

  <!-- Arrow 1 to 2 -->
  <path d="M 248 182 L 268 182" stroke="#737373" stroke-width="1.5" stroke-dasharray="3 3"/>
  <polygon points="268,178 274,182 268,186" fill="#737373"/>

  <!-- 2. Proceso Taller Autosol -->
  <rect x="274" y="92" width="212" height="180" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="1.5"/>
  <rect x="274" y="92" width="212" height="32" rx="7" fill="#171717"/>
  <text x="290" y="113" font-family="'Manrope', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">2. PROCESOS DE TALLER</text>
  <text x="290" y="142" font-family="'DM Sans', sans-serif" font-size="11.5" font-weight="700" fill="#171717">Mapeo de Actividades:</text>
  <text x="290" y="166" font-family="'DM Sans', sans-serif" font-size="11" fill="#404040">─ Servicio Periódico (10k / 20k km)</text>
  <text x="290" y="190" font-family="'DM Sans', sans-serif" font-size="11" fill="#404040">─ Mecánica Pesada y Cajas</text>
  <text x="290" y="214" font-family="'DM Sans', sans-serif" font-size="11" fill="#404040">─ Preparación y Lavado 0KM (PDI)</text>
  <text x="290" y="238" font-family="'DM Sans', sans-serif" font-size="11" fill="#404040">─ Reparación de Carrocería</text>

  <!-- Arrow 2 to 3 -->
  <path d="M 494 182 L 514 182" stroke="#737373" stroke-width="1.5" stroke-dasharray="3 3"/>
  <polygon points="514,178 520,182 514,186" fill="#737373"/>

  <!-- 3. Salidas e Impactos Ambientales -->
  <rect x="520" y="92" width="216" height="180" rx="8" fill="#FFFFFF" stroke="#E5E5E2"/>
  <rect x="520" y="92" width="216" height="32" rx="8" fill="#F8F8F6"/>
  <text x="534" y="113" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#171717">3. ASPECTOS / RESIDUOS</text>
  <text x="534" y="142" font-family="'DM Sans', sans-serif" font-size="11.5" font-weight="600" fill="#242424">• Aceites usados (Cat. Ley Y8)</text>
  <text x="534" y="166" font-family="'DM Sans', sans-serif" font-size="11.5" font-weight="600" fill="#242424">• Filtros y trapos impregnados (Y48)</text>
  <text x="534" y="190" font-family="'DM Sans', sans-serif" font-size="11.5" font-weight="600" fill="#242424">• Baterías plomo-ácido agotadas</text>
  <text x="534" y="214" font-family="'DM Sans', sans-serif" font-size="11.5" font-weight="600" fill="#242424">• Efluentes con hidrocarburos</text>
  <text x="534" y="238" font-family="'DM Sans', sans-serif" font-size="11.5" font-weight="600" fill="#242424">• Emisiones VOC en pintura</text>

  <!-- Lower Table: Matriz de Significancia y Control -->
  <rect x="24" y="292" width="712" height="164" rx="8" fill="#FFFFFF" stroke="#E5E5E2"/>
  <rect x="24" y="292" width="712" height="30" rx="8" fill="#F4F4F2"/>
  <text x="36" y="312" font-family="'Manrope', sans-serif" font-size="10.5" font-weight="800" fill="#171717" letter-spacing="0.04em">EVALUACIÓN DE SIGNIFICANCIA Y MEDIDAS DE CONTROL OPERATIVO</text>

  <!-- Headers -->
  <text x="36" y="342" font-family="'DM Sans', sans-serif" font-size="10" font-weight="700" fill="#737373">ASPECTO AMBIENTAL</text>
  <text x="210" y="342" font-family="'DM Sans', sans-serif" font-size="10" font-weight="700" fill="#737373">IMPACTO POTENCIAL</text>
  <text x="380" y="342" font-family="'DM Sans', sans-serif" font-size="10" font-weight="700" fill="#737373">SEV × PROB</text>
  <text x="470" y="342" font-family="'DM Sans', sans-serif" font-size="10" font-weight="700" fill="#737373">SIGNIFICANCIA</text>
  <text x="580" y="342" font-family="'DM Sans', sans-serif" font-size="10" font-weight="700" fill="#737373">CONTROL OPERATIVO</text>
  <line x1="24" y1="350" x2="736" y2="350" stroke="#E5E5E2"/>

  <!-- Row 1 -->
  <text x="36" y="372" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#171717">Aceite lubricante usado</text>
  <text x="210" y="372" font-family="'DM Sans', sans-serif" font-size="11" fill="#404040">Contaminación suelo y freática</text>
  <text x="380" y="372" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#171717">4 × 4 = 16</text>
  <rect x="470" y="360" width="76" height="18" rx="9" fill="#171717"/>
  <text x="480" y="373" font-family="'DM Sans', sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">CRÍTICO (A)</text>
  <text x="580" y="372" font-family="'DM Sans', sans-serif" font-size="11" fill="#404040">Bateas estancas + Tratador</text>
  <line x1="24" y1="384" x2="736" y2="384" stroke="#F1F1EF"/>

  <!-- Row 2 -->
  <text x="36" y="404" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#171717">Efluente lavado automotor</text>
  <text x="210" y="404" font-family="'DM Sans', sans-serif" font-size="11" fill="#404040">Afectación de red cloacal</text>
  <text x="380" y="404" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#171717">3 × 4 = 12</text>
  <rect x="470" y="392" width="76" height="18" rx="9" fill="#404040"/>
  <text x="480" y="405" font-family="'DM Sans', sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">MODERADO</text>
  <text x="580" y="404" font-family="'DM Sans', sans-serif" font-size="11" fill="#404040">Cámara interceptora</text>
  <line x1="24" y1="416" x2="736" y2="416" stroke="#F1F1EF"/>

  <!-- Row 3 -->
  <text x="36" y="436" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#171717">Consumo energético red</text>
  <text x="210" y="436" font-family="'DM Sans', sans-serif" font-size="11" fill="#404040">Agotamiento recursos fósiles</text>
  <text x="380" y="436" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#171717">2 × 3 = 6</text>
  <rect x="470" y="424" width="76" height="18" rx="9" fill="#E0E0DC"/>
  <text x="485" y="437" font-family="'DM Sans', sans-serif" font-size="9" font-weight="700" fill="#171717">LEVE</text>
  <text x="580" y="436" font-family="'DM Sans', sans-serif" font-size="11" fill="#404040">Sensores y LED de taller</text>
</svg>
